# Push a tag v<version> (matching every trade's manifest.json) to publish: each trade's pack and its checksum are
# attached to the GitHub release, where AgentOrch downloads releases/latest/download/trade-<id>.zip from.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack
        run: python tools/pack.py --tag "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
